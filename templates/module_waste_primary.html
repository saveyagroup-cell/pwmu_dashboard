<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Primary Segregation — Ecobyte PWMU</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #F8FAFC; }
  .video-box { aspect-ratio: 16/9; background:#0F172A; }
  .video-box img { width:100%; height:100%; object-fit:contain; }
  .progress-track { background:#E2E8F0; border-radius:999px; height:10px; overflow:hidden; }
  .progress-fill { height:100%; border-radius:999px; transition: width .4s ease; }
</style>
</head>
<body class="text-slate-800">
{% include "_header.html" %}

<main class="max-w-[1300px] mx-auto px-6 py-6">
  <a href="{{ url_for('home_page') }}" class="text-sm text-[#1E3A8A] font-semibold" data-i18n="common.back">← Back to Hub</a>

  <div class="grid grid-cols-1 lg:grid-cols-5 gap-6 mt-4">
    <div class="lg:col-span-3 bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
      <div class="px-4 pt-3 pb-2 border-b border-slate-100 flex items-center justify-between">
        <div>
          <h3 class="text-sm font-bold text-[#0F172A]">♻️ Primary Waste Segregation</h3>
          <p class="text-xs text-slate-500">Conveyor 1 — Metal vs Other Waste</p>
        </div>
        <span id="live-badge" class="hidden text-[10px] font-bold px-2 py-1 rounded-full bg-red-50 text-red-600 border border-red-200">● LIVE</span>
      </div>
      <div class="video-box relative">
        <img id="feed-img" class="hidden">
        <div id="feed-placeholder" class="absolute inset-0 flex items-center justify-center text-slate-400 text-xs px-4 text-center">Camera offline — click Start or upload footage</div>
      </div>
      <div class="px-4 py-2.5 flex items-center gap-2 bg-slate-50 flex-wrap">
        <button id="toggle-btn" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-3.5 py-1.5 rounded-md transition">Start Camera</button>
        <label class="text-xs font-medium text-slate-500 border border-slate-200 rounded-md px-3 py-1.5 bg-white cursor-pointer hover:border-slate-300">
          Upload Footage <input id="upload-input" type="file" accept="video/*" class="hidden">
        </label>
        <a href="/api/download/video/waste_primary" class="text-xs font-medium text-[#1E3A8A] border border-blue-200 rounded-md px-3 py-1.5 bg-blue-50 hover:bg-blue-100">⬇ Video</a>
        <a href="/api/report_pdf/waste_primary?period=all" class="text-xs font-medium text-white bg-[#1E3A8A] hover:bg-blue-900 rounded-md px-3 py-1.5">⬇ PDF Report</a>
      </div>
    </div>

    <div class="lg:col-span-2 bg-white rounded-xl border border-slate-200 shadow-sm p-4">
      <h3 class="text-sm font-bold text-slate-700 mb-3">Efficiency Indicator</h3>
      <div id="stage1-bars" class="space-y-3 text-sm"><p class="text-slate-400 text-xs">No detections yet</p></div>
    </div>
  </div>
</main>

<script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
<script src="{{ url_for('static', filename='js/module_common.js') }}"></script>
<script>
  setupModulePanel("waste_primary", {{ 'true' if active else 'false' }});
  const PALETTE = ["#3B82F6", "#94A3B8", "#F59E0B", "#16A34A"];

  async function refreshCounts() {
    try {
      const res = await fetch("/api/counts/waste_primary");
      const data = await res.json();
      const el = document.getElementById("stage1-bars");
      const entries = Object.entries(data);
      if (!entries.length) { el.innerHTML = `<p class="text-slate-400 text-xs">No detections yet</p>`; return; }
      const max = Math.max(...entries.map(([, v]) => v), 1);
      el.innerHTML = entries.map(([label, count], i) => `
        <div>
          <div class="flex justify-between text-xs mb-1">
            <span class="font-medium text-slate-600">${label}</span><span class="text-slate-400">${count}</span>
          </div>
          <div class="progress-track"><div class="progress-fill" style="width:${(count/max)*100}%; background:${PALETTE[i % PALETTE.length]}"></div></div>
        </div>`).join("");
    } catch (e) {}
  }
  refreshCounts();
  setInterval(refreshCounts, 3000);
</script>
</body>
</html>
